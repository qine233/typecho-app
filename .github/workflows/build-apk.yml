name: 构建 APK

# 打 tag（v1.0.0 这样）会编译并把 APK 挂到对应的 GitHub Release 上；
# 平时的 push / PR 只跑测试和编译，产物放在 Actions 的 Artifacts 里。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试 + 打包
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: 整理产物名
        run: cp app/build/outputs/apk/debug/app-debug.apk "TypechoApp-${GITHUB_REF_NAME}-debug.apk"

      - name: 上传到 Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: TypechoApp-*-debug.apk

      - name: 发布到 Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: TypechoApp-*-debug.apk
          generate_release_notes: true
          append_body: true
          body: |

            ## 这个包
            - debug 签名（Android 通用 debug keystore），可直接安装，和 release 版可并存
            - 包名 `noline.zhouzhou.debug`
            - 想要正式签名的 release 包，需要在仓库 Secrets 里配 keystore，见 README「自动构建与下载」一节
